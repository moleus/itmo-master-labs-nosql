# One JSON object per request. The fields match templates/logs-nginx-template.json.
log_format json escape=json
  '{"@timestamp":"$time_iso8601","remote_addr":"$remote_addr","request":"$request",'
  '"status":$status,"bytes_sent":$bytes_sent,"http_user_agent":"$http_user_agent"}';

server {
  listen 80;
  root /usr/share/nginx/html;
  access_log /var/log/nginx/access.json json;

  location / {
    try_files $uri $uri/ =404;
  }
}
