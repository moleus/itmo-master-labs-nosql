# ВМ из Vagrantfile. Запускать ansible-playbook из этой директории.
[mongo]
soloviev-mongo ansible_host=192.168.176.110 ansible_user=vagrant ansible_ssh_private_key_file=.vagrant/machines/mongo/vmware_desktop/private_key

