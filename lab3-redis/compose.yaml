name: lab3-redis

x-bento: &bento
  image: ${BENTO_IMAGE:-ghcr.io/warpstreamlabs/bento:1.23.0}
  command: ["-c", "/etc/bento/bento.yaml"]
  volumes:
    - ./bento/bento.yaml:/etc/bento/bento.yaml:ro
  restart: unless-stopped
  depends_on: [redis, vm-main]

services:
  # Victim: one core, 500 MB. Defaults for everything else.
  vm-main:
    image: victoriametrics/victoria-metrics:v1.106.1
    command:
      - -storageDataPath=/vm
      - -retentionPeriod=1d
      - -search.latencyOffset=0s
    cpus: 1
    mem_limit: 500m
    memswap_limit: 500m
    restart: unless-stopped
    ports: ["127.0.0.1:8428:8428"]
    volumes: [vm-main-data:/vm]

  # Monitoring of the pipeline. It scrapes itself, not through Bento.
  vm-mon:
    image: victoriametrics/victoria-metrics:v1.106.1
    command:
      - -storageDataPath=/vm
      - -retentionPeriod=7d
      - -promscrape.config=/etc/vm-mon/scrape.yml
      - -selfScrapeInterval=0
    restart: unless-stopped
    ports: ["127.0.0.1:8429:8428"]
    volumes:
      - vm-mon-data:/vm
      - ./vm-mon/scrape.yml:/etc/vm-mon/scrape.yml:ro

  redis:
    image: redis:7.4.1-alpine
    command: ["redis-server", "/etc/redis/redis.conf"]
    restart: unless-stopped
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["./redis/redis.conf:/etc/redis/redis.conf:ro"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  redis-exporter:
    image: oliver006/redis_exporter:v1.66.0
    command: ["--redis.addr=redis://redis:6379"]
    restart: unless-stopped
    ports: ["127.0.0.1:9121:9121"]
    depends_on: [redis]

  web1: &web
    build: ./web
    image: lab3-web:local
    environment:
      USER_SERIES_TTL: ${USER_SERIES_TTL:-3s}
    restart: unless-stopped
    ports: ["127.0.0.1:8081:8080"]
  web2:
    <<: *web
    ports: ["127.0.0.1:8082:8080"]

  bento1:
    <<: *bento
    environment:
      SCRAPE_URL: http://web1:8080/metrics
      INSTANCE: web1
      LIMIT: ${LIMIT:-100}
      WINDOW_SECONDS: ${WINDOW_SECONDS:-60}
    ports: ["127.0.0.1:4195:4195"]
  bento2:
    <<: *bento
    environment:
      SCRAPE_URL: http://web2:8080/metrics
      INSTANCE: web2
      LIMIT: ${LIMIT:-100}
      WINDOW_SECONDS: ${WINDOW_SECONDS:-60}
    ports: ["127.0.0.1:4196:4195"]

  k6:
    image: grafana/k6:0.55.0
    command: ["run", "-o", "experimental-prometheus-rw", "/scripts/load.js"]
    environment:
      RPS: ${RPS:-400}
      USER_POOL: ${USER_POOL:-1000000}
      K6_PROMETHEUS_RW_SERVER_URL: http://vm-mon:8428/api/v1/write
      K6_PROMETHEUS_RW_TREND_AS_NATIVE_HISTOGRAM: "false"
      K6_PROMETHEUS_RW_PUSH_INTERVAL: 5s
    volumes: ["./k6/load.js:/scripts/load.js:ro"]
    depends_on: [web1, web2, vm-mon]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    restart: unless-stopped
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [vm-mon, vm-main]

volumes:
  vm-main-data:
  vm-mon-data:
